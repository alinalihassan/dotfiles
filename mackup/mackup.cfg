# Mackup config — only GUI / macOS prefs not already managed by Dotbot.
# Use copy mode on modern macOS (Sonoma+): `mackup backup` / `mackup restore`
# Do NOT use `mackup link` — symlinked preferences break on current macOS.

[storage]
engine = file_system
path = Developer/dotfiles
directory = mackup/store

# Whitelist: apps we care about that Mackup (or ~/.mackup custom defs) supports.
# Everything else is skipped — especially fish/nvim/git/ghostty/etc. already in this repo.
[applications_to_sync]
alt-tab
magnet
clop
rcmd
pure-paste
dropover
klack
flighty
command-x
cursor
macosx
