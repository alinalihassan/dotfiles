- defaults:
    link:
      relink: true
      force: true
      create: true
    brewfile:
      stdout: true
      stderr: true
      include: ['tap', 'brew', 'cask', 'mas']

# Set up all symlinks
- link:
    ~/.gitconfig: git/.gitconfig
    ~/.gitignore_global: git/.gitignore_global
    ~/.config/nvim: nvim
    ~/.config/fish: fish
    ~/.config/bat: bat
    ~/.config/ghostty: ghostty

    # Linking individual files to config folder
    ~/.config/opencode/opencode.jsonc: opencode/opencode.jsonc # Opencode adds junk to config folder https://github.com/sst/opencode/issues/3191
    ~/Library/Application\ Support/lazygit/config.yml: lazygit/config.yml

# Configure Fish
- shell:
    - description: Install Brew
      command: command -v brew &>/dev/null || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    - description: Set Fish as default shell
      command: chsh -s $(which fish)
      stdout: true
      stderr: true
    - description: Install Fish Plugins
      command: fish -c "fisher update"

# Install all apps and tools with Brew
- brewfile:
    file: brew/Brewfile
