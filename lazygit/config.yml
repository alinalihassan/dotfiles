# yaml-language-server: $schema=https://json.schemastore.org/lazygit.json
gui:
  nerdFontsVersion: '3'
  showNumstatInFilesView: true
  showRandomTip: false
  showCommandLog: false
  # ToykoNight Theme
  theme:
    activeBorderColor:
      - "#ff9e64"
      - "bold"
    inactiveBorderColor:
      - "#27a1b9"
    searchingActiveBorderColor:
      - "#ff9e64"
      - "bold"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#7aa2f7"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#db4b4b"
    defaultFgColor:
      - "#c0caf5"
git:
  parseEmoji: true
  log:
    showGraph: 'always'
  paging:
    colorArg: always
    pager: delta --paging=never
os:
  openLink: open "$(echo {{link}} | sed 's/%2F/\//g')"
  editPreset: 'nvim'
services:
  'gitlab.booking.com': 'gitlab:gitlab.booking.com' # Work-related
